version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      - ./app/uploads:/app/app/uploads
      - ./app/static:/app/app/static
      - ./app/db:/app/app/db
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/uploads:/usr/share/nginx/uploads:ro
      - ./app/static:/usr/share/nginx/static:ro
    depends_on:
      - app
