<!DOCTYPE html>
<html lang="ру">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация пользователя</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto max-w-screen-sm p-6">
    <header class="mb-8">
      <div
        class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-6 py-5 text-white">
        <h1 class="text-2xl font-extrabold tracking-tight">
          <a href="/">Wrinkles DB</a>
        </h1>
        <nav class="text-lg font-medium">
          <a href="/" class="hover:underline hover:text-yellow-200 transition">Главная</a>
        </nav>
      </div>
    </header>

    <div class="bg-white rounded-lg shadow-md p-6">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Создать пользователя</h2>
      <form method="post" action="/admin/users" class="space-y-4">
        <div>
          <label class="block text-gray-700 mb-1">Логин</label>
          <input name="username" type="text" required
            class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Пароль</label>
          <input name="password" type="password" required
            class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label class="block text-gray-700 mb-1">Роль</label>
          <select name="role"
            class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            {% for role in roles %}

            <option value="{{role}}">{{role}}</option>

            {% endfor %}
          </select>
        </div>
        <button type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 shadow hover:shadow-md transition">
          Создать
        </button>
      </form>
    </div>
  </div>
</body>

</html>
