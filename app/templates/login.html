<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrinkles DB — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />

  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #c7d2fe 0%, #e0e7ff 25%, #ede9fe 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.55;
      animation: float 9s ease-in-out infinite alternate;
    }
    .orb.blue { background: #6366f1; top: 10%; left: 15%; width: 250px; height: 250px; animation-delay: 0s; }
    .orb.purple { background: #a855f7; bottom: 5%; right: 10%; width: 320px; height: 320px; animation-delay: 2s; }
    .orb.pink { background: #ec4899; top: 65%; left: 20%; width: 200px; height: 200px; animation-delay: 4s; }

    @keyframes float {
      from { transform: translateY(0px) scale(1); opacity: 0.6; }
      to { transform: translateY(-30px) scale(1.05); opacity: 0.8; }
    }

    @keyframes pulseGlow {
      0%, 100% {
        filter: drop-shadow(0 0 15px rgba(147, 51, 234, 0.9))
                drop-shadow(0 0 30px rgba(79, 70, 229, 0.7));
        transform: rotate(-3deg) scale(1);
      }
      50% {
        filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.9))
                drop-shadow(0 0 40px rgba(99, 102, 241, 0.9));
        transform: rotate(3deg) scale(1.1);
      }
    }

    .logo-icon {
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .login-card {
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes buttonGlow {
      0%, 100% {
        box-shadow: 0 0 15px #4f46e5, 0 0 25px #9333ea;
      }
      50% {
        box-shadow: 0 0 25px #9333ea, 0 0 35px #4f46e5;
      }
    }

    .animate-glow {
      animation: buttonGlow 1.5s ease-in-out infinite alternate;
    }

    /* Адаптив */
    @media (max-width: 640px) {
      .orb { filter: blur(60px); }
      .login-card { padding: 6%; width: 90%; }
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>

<body>
  <div class="orb blue"></div>
  <div class="orb purple"></div>
  <div class="orb pink"></div>

  <div class="login-card relative z-10 w-full max-w-md bg-white/80 backdrop-blur-xl p-8 rounded-2xl shadow-2xl border border-white/40">
    <div class="flex flex-col items-center mb-6">
      <svg class="w-20 h-20 text-indigo-600 logo-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
      </svg>

      <h1 class="text-3xl font-extrabold text-gray-800 mt-2 tracking-tight text-center">Wrinkles DB</h1>
      <p class="text-sm text-gray-500 mt-1 text-center">Вход</p>
    </div>

    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-2 rounded-lg flex items-center gap-2">
      <span>⚠️</span><span>{{ error }}</span>
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-5">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Логин</label>
        <div class="relative">
          <input id="username" name="username" type="text" required
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 pl-9 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white/70 transition duration-200 focus:shadow-md">
          <span class="absolute inset-y-0 left-2 flex items-center text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M5.121 17.804A11 11 0 0112 15c2.314 0 4.437.735 6.163 1.985M15 10a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
          </span>
        </div>
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
        <div class="relative">
          <input id="password" name="password" type="password" required
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 pl-9 focus:outline-none focus:ring-2 focus:ring-purple-500 bg-white/70 transition duration-200 focus:shadow-md">
          <span class="absolute inset-y-0 left-2 flex items-center text-gray-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-5a2 2 0 00-2-2H6a2 2 0 00-2 2v5a2 2 0 002 2zm10-11a4 4 0 10-8 0v3h8v-3z" />
            </svg>
          </span>
        </div>
      </div>

      <button type="submit"
              class="w-full py-2 rounded-lg bg-gradient-to-r from-purple-500 to-blue-500 text-white font-bold shadow-md hover:shadow-2xl hover:scale-105 transition-all duration-300 animate-glow">
        Войти
      </button>
    </form>

  </div>
</body>
</html>
