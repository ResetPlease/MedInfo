<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Управление тегами — Wrinkles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <style>
    @keyframes fade { from { opacity: 0; transform: translateY(-5px);} to { opacity: 1; transform: translateY(0);} }
    .animate-fade { animation: fade 0.2s ease-out; }
  </style>
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto max-w-screen-lg p-6">
    <header class="mb-8">
      <div class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-4 sm:px-6 py-4 text-white">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
          </svg>
          <a href="/" class="hover:text-yellow-300 transition">Wrinkles<span class="hidden sm:inline-block"> DB</span></a>
        </h1>

        <div class="flex items-center gap-3 sm:gap-4 w-full sm:w-auto justify-between sm:justify-end mt-4 sm:mt-0">
          <a href="/" class="hidden sm:inline hover:underline">Главная</a>
          <a href="/upload" class="hidden sm:inline hover:underline">Загрузить</a>
          <a href="/predict" class="hidden sm:inline hover:underline">Magic</a>
          <a href="/stats" class="hidden sm:inline hover:underline">Info</a>
          <div class="relative">
            <button onclick="toggleMenu()" class="text-sm bg-white/10 hover:bg-white/20 rounded px-2 py-1">Аккаунт</button>
            <div id="accountMenu" class="hidden absolute right-0 mt-2 w-44 bg-white text-gray-800 rounded-xl shadow-lg py-2 animate-fade">
              <div class="px-3 py-2 text-sm text-gray-600 truncate border-b">{{ request.state.current_user.username }}</div>
              <form action="/logout" method="post">
                <button class="w-full text-left px-3 py-2 hover:bg-gray-100 text-sm rounded-b-xl">Выйти</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="bg-white rounded-xl shadow p-6">
      <h2 class="text-xl font-semibold mb-4">Теги</h2>
      <form method="post" action="/admin/tags" class="flex gap-2 mb-6">
        <input type="text" name="name" placeholder="Новый тег" class="flex-1 p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Добавить</button>
      </form>

      <ul class="divide-y divide-gray-200">
        {% for tag in tags %}
        <li class="py-2 flex items-center justify-between">
          <span class="text-gray-800">{{ tag.name }}</span>
          <form method="post" action="/admin/tags/{{ tag.id }}/delete" onsubmit="return confirm('Удалить тег \"{{ tag.name }}\"?');">
            <button class="text-sm text-red-600 hover:text-red-700">Удалить</button>
          </form>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>

  <script>
    function toggleMenu() { const m = document.getElementById('accountMenu'); if (m) m.classList.toggle('hidden'); }
    window.addEventListener('click', (e) => {
      const menu = document.getElementById('accountMenu');
      const trigger = e.target.closest('button');
      if (!menu) return;
      if (!e.target.closest('#accountMenu') && (!trigger || trigger.textContent.trim() !== 'Аккаунт')) {
        menu.classList.add('hidden');
      }
    });
  </script>
</body>

</html>
