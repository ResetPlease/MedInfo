<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedImage Wrinkle Database</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div class="container mx-auto p-6">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Upload image</h1>
        
        <div class="flex justify-center mb-6">
            <a href="/" class="bg-gray-500 text-white p-2 rounded-md hover:bg-gray-600 transition">
                back
            </a>
        </div>

        <form method="post" enctype="multipart/form-data" class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto">
            <div class="mb-4">
                <label for="file" class="block text-gray-700 font-semibold mb-2">Select image</label>
                <input type="file" id="file" name="file" accept=".jpg,.jpeg,.png" required 
                       class="w-full p-2 border border-gray-300 rounded-md">
            </div>

            <div class="mb-4">
                <div class="flex items-center">
                    <label for="name" class="block text-gray-700 font-semibold mb-2">Name:</label>
                    <span class="ml-2 text-gray-500 cursor-help" title="Название будет автоматически заполнено на основе имени файла">i</span>
                </div>
                <input type="text" id="name" name="name" required 
                       class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Tags:</label>
                <div class="space-y-2">
                    {% for tag in tags %}
                    <div class="flex items-center">
                        <input type="checkbox" id="{{ tag }}" name="tags" value="{{ tag }}" 
                               class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                        <label for="{{ tag }}" class="ml-2 text-gray-700">{{ tag }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <button type="submit" 
                    class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 transition">
                Upload
            </button>
        </form>
    </div>
    <script>
        // Автозаполнение поля названия на основе имени файла
        document.getElementById('file').addEventListener('change', function(event) {
            const fileInput = event.target;
            const nameInput = document.getElementById('name');
            if (fileInput.files.length > 0) {
                const fileName = fileInput.files[0].name;
                // Удаляем расширение файла
                const nameWithoutExtension = fileName.split('.').slice(0, -1).join('.');
                nameInput.value = nameWithoutExtension;
            }
        });
    </script>
</body>
</html>
