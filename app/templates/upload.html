<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload — Wrinkles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <style>
    #accountMenu { z-index: 1100; }

    @keyframes fade { from {opacity:0; transform:translateY(-5px);} to {opacity:1; transform:translateY(0);} }
    .animate-fade { animation: fade 0.2s ease-out; }

    /* ---- Модалка ---- */
    #predictModal {
      background-color: rgba(0,0,0,0.6);
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(5px);
    }

    .modal-content {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      animation: fade 0.3s ease-out;
      box-shadow: 0 0 20px rgba(99,102,241,0.3);
    }

    .spinner {
      width: 60px; height: 60px;
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-top: 5px solid #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      box-shadow: 0 0 10px #4f46e5, 0 0 20px #9333ea;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .tag {
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      color: white;
      border-radius: 9999px;
      padding: 4px 12px;
      font-size: 0.85rem;
      font-weight: 500;
      margin: 4px;
      display: inline-block;
      animation: fade 0.4s ease forwards;
      box-shadow: 0 0 6px #4f46e5;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .tag:hover { transform: scale(1.1); box-shadow: 0 0 12px #9333ea; }

    /* Tooltip */
    .tooltip {
      position: absolute;
      background: rgba(30,30,30,0.85);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: nowrap;
      transform: translate(-50%, -130%);
      left: 50%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .tooltip::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(30,30,30,0.85);
    }
    .tooltip-container:hover .tooltip { opacity: 1; }
  </style>
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto max-w-screen-md p-6">
    <!-- HEADER -->
    <header class="mb-8">
      <div class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-4 sm:px-6 py-4 text-white">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
          </svg>
          <a href="/" class="hover:text-yellow-300 transition">Wrinkles<span class="hidden sm:inline-block"> DB</span></a>
        </h1>
      </div>
    </header>

    <!-- ФОРМА -->
    <form method="post" enctype="multipart/form-data"
      class="bg-gradient-to-tr from-blue-50 to-purple-50 p-6 rounded-xl shadow-lg max-w-lg mx-auto space-y-4 relative overflow-hidden">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Загрузка изображения</h2>

      <input type="file" id="file" name="file" accept=".jpg,.jpeg,.png" required
        class="w-full p-2 border border-gray-300 rounded-md" />

      <div id="previewContainer" class="hidden mt-4 relative">
        <img id="previewImage" src="" alt="Preview"
          class="w-full max-h-64 object-contain rounded-lg shadow-lg transition-all duration-300" />
      </div>

      {% if isModelAdmin(request.state.current_user) %}
      <div class="flex justify-center tooltip-container relative">
        <button type="button" id="predictBtn"
          class="hidden mt-4 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md hover:shadow-xl transition-all">
          🔮 Предсказать морщины
        </button>
        <div class="tooltip">Модель предложит вероятные теги</div>
      </div>
      {% endif %}

      <label for="name" class="block text-gray-700 font-semibold mb-2">Название изображения</label>
      <input type="text" id="name" name="name"
        class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Теги:</label>
        <div class="space-y-2" id="tagsSection">
          {% for tag in tags %}
          <div class="flex items-center">
            <input type="checkbox" id="{{ tag }}" name="tags" value="{{ tag }}"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
            <label for="{{ tag }}" class="ml-2 text-gray-700">{{ tag }}</label>
          </div>
          {% endfor %}
        </div>
      </div>

      <button type="submit"
        class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white p-2 rounded-lg hover:from-purple-600 hover:to-blue-500 shadow-md hover:shadow-xl transition-all">
        Загрузить
      </button>
    </form>
  </div>

  <div id="predictModal" class="hidden fixed inset-0 flex justify-center items-center">
    <div class="modal-content">
      <div id="loaderBlock">
        <h3 class="text-lg font-bold text-gray-700">Предсказание морщин...</h3>
        <div class="spinner"></div>
      </div>
      <div id="predictedTags" class="hidden">
        <h3 class="text-lg font-semibold text-gray-700 mb-3">Модель предлагает:</h3>
        <div id="tagsContainer" class="flex flex-wrap justify-center"></div>
        <button onclick="closeModal()" class="mt-4 bg-gradient-to-r from-purple-500 to-blue-500 text-white px-4 py-1.5 rounded-lg text-sm shadow hover:shadow-lg transition">
          Закрыть
        </button>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("previewImage");
    const previewContainer = document.getElementById("previewContainer");
    const nameInput = document.getElementById("name");
    const predictBtn = document.getElementById("predictBtn");

    fileInput?.addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        previewContainer.classList.remove("hidden");
        if (predictBtn) predictBtn.classList.remove("hidden");
      };
      reader.readAsDataURL(file);
      nameInput.value = file.name.split(".").slice(0, -1).join(".");
    });


    predictBtn?.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) return;
      const formData = new FormData();
      formData.append("file", file);

      const modal = document.getElementById("predictModal");
      const loader = document.getElementById("loaderBlock");
      const predicted = document.getElementById("predictedTags");
      const tagsContainer = document.getElementById("tagsContainer");
      modal.style.display = "flex";
      loader.classList.remove("hidden");
      predicted.classList.add("hidden");
      tagsContainer.innerHTML = "";

      try {
        const response = await fetch("/predict", { method: "POST", body: formData });
        const data = await response.json();
        loader.classList.add("hidden");
        predicted.classList.remove("hidden");

        if (data.wrinkles?.length) {
          data.wrinkles.forEach(tag => {
            const el = document.createElement("span");
            el.className = "tag";
            el.textContent = tag;
            el.onclick = () => toggleTag(tag);
            tagsContainer.appendChild(el);

            const checkbox = document.getElementById(tag);
            if (checkbox) checkbox.checked = true;
          });
        } else {
          tagsContainer.innerHTML = "<p class='text-gray-500'>Морщины не обнаружены 💤</p>";
        }
      } catch (e) {
        loader.classList.add("hidden");
        tagsContainer.innerHTML = "<p class='text-red-500'>Ошибка при предсказании 😢</p>";
        predicted.classList.remove("hidden");
      }
    });

    function toggleTag(tag) {
      const checkbox = document.getElementById(tag);
      if (checkbox) checkbox.checked = !checkbox.checked;
    }

    function closeModal() {
      document.getElementById("predictModal").style.display = "none";
    }
  </script>
</body>
</html>
