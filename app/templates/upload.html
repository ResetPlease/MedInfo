<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload — Wrinkles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto max-w-screen-md p-6">
    <header class="mb-8">
      <div
        class="flex flex-col sm:flex-row items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-6 py-5 text-white">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight flex items-center gap-2">
          <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
          </svg>
          <a href="/">Wrinkles<span class="hidden sm:inline-block"> DB</span></a>
        </h1>

        <nav class="mt-4 sm:mt-0 flex space-x-4 text-lg font-medium">
          <a href="/" class="hover:underline hover:text-yellow-200 transition">Главная</a>
          <a href="/upload" class="hover:underline hover:text-yellow-200 transition">Загрузить</a>
          <!-- <a href="/backup" class="hover:underline hover:text-yellow-200 transition">Бэкап</a> -->
          <a href="/stats" class="hover:underline hover:text-yellow-200 transition">Статистика</a>
        </nav>
      </div>
    </header>

    <form method="post" enctype="multipart/form-data"
      class="bg-white p-6 rounded-lg shadow-md max-w-lg mx-auto space-y-4">
      <div>
        <label for="file" class="block text-gray-700 font-semibold mb-2">Выберите изображение</label>
        <input type="file" id="file" name="file" accept=".jpg,.jpeg,.png" required
          class="w-full p-2 border border-gray-300 rounded-md" />
      </div>

      <div>
        <label for="name" class="block text-gray-700 font-semibold mb-2">Название изображения</label>
        <input type="text" id="name" name="name" required
          class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p class="text-sm text-gray-400 italic mt-1">Название будет взято из имени файла, если оставить пустым</p>
      </div>

      <div>
        <label class="block text-gray-700 font-semibold mb-2">Теги:</label>
        <div class="space-y-2">
          {% for tag in tags %}
          <div class="flex items-center">
            <input type="checkbox" id="{{ tag }}" name="tags" value="{{ tag }}"
              class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
            <label for="{{ tag }}" class="ml-2 text-gray-700">{{ tag }}</label>
          </div>
          {% endfor %}
        </div>
        <p class="text-sm text-gray-400 italic mt-1">Выберите хотя бы один тег</p>
      </div>

      <button type="submit"
        class="w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 shadow hover:shadow-md transition-transform active:scale-95">
        Загрузить
      </button>
    </form>
  </div>

  <script>
    document.getElementById("file").addEventListener("change", function (event) {
      const fileInput = event.target;
      const nameInput = document.getElementById("name");
      if (fileInput.files.length > 0) {
        const fileName = fileInput.files[0].name;
        const nameWithoutExtension = fileName.split(".").slice(0, -1).join(".");
        nameInput.value = nameWithoutExtension;
      }
    });
  </script>
</body>

</html>
