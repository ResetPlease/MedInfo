<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Админ · Общая статистика — Wrinkles</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .card-gradient {
      background: linear-gradient(135deg, rgba(99,102,241,0.05), rgba(147,51,234,0.08));
    }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">
  <div class="container mx-auto max-w-screen-xl p-6">

    <!-- HEADER -->
    <header class="mb-10">
      <div class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl shadow-lg px-4 sm:px-6 py-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
          </svg>
          <a href="/" class="hover:text-yellow-300 transition">Wrinkles<span class="hidden sm:inline-block"> DB</span></a>
        </h1>
        <nav class="hidden sm:flex items-center gap-6 text-lg font-medium">
          <a href="/" class="hover:underline hover:text-yellow-200 transition">Главная</a>
          <a href="/predict" class="hover:underline hover:text-yellow-200 transition">Magic</a>
          <a href="/stats" class="hover:underline hover:text-yellow-200 transition">Info</a>
          <a href="/admin/stats" class="underline text-yellow-200 font-semibold">Админ</a>
          <div class="relative">
            <button onclick="toggleMenu()" class="text-sm bg-white/10 hover:bg-white/20 rounded px-2 py-1">Аккаунт</button>
            <div id="accountMenu" class="hidden absolute right-0 mt-2 w-44 bg-white text-gray-800 rounded-xl shadow-lg py-2">
              <div class="px-3 py-2 text-sm text-gray-600 truncate border-b">
                {{ request.state.current_user.username }}
              </div>
              <form action="/logout" method="post">
                <button class="w-full text-left px-3 py-2 hover:bg-gray-100 text-sm rounded-b-xl">Выйти</button>
              </form>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <!-- MAIN -->
    <main class="space-y-10 fade-in">
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-2">
          Общая статистика пользователей
        </h2>
        <p class="text-gray-600 text-sm">
          Всего пользователей: <span class="font-semibold text-blue-700" id="totalUsers">–</span>
        </p>
      </div>

      <!-- Таблица -->
      <section class="bg-white/90 backdrop-blur-md rounded-2xl shadow-lg p-6 overflow-x-auto card-gradient fade-in">
        <h3 class="text-xl font-semibold text-gray-800 mb-4 text-center">Пользователи</h3>
        <table class="w-full text-sm text-gray-700 border-collapse">
          <thead class="text-xs uppercase text-gray-500 border-b">
            <tr>
              <th class="py-2 px-3 text-left">Имя</th>
              <th class="py-2 px-3 text-center">Роль</th>
              <th class="py-2 px-3 text-center">Изображений</th>
              <th class="py-2 px-3 text-center">Сегментов</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </section>

      <!-- Диаграмма -->
      <section class="bg-white/90 backdrop-blur-md rounded-2xl shadow-lg p-6 card-gradient fade-in">
        <h3 class="text-xl font-semibold text-gray-800 mb-4 text-center">Активность по загрузкам</h3>
        <div class="h-[420px]">
          <canvas id="activityChart"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script>
    async function loadUsers() {
      const resp = await fetch('/api/admin/users');
      const data = await resp.json();
      const table = document.getElementById('usersTable');
      const totalUsers = document.getElementById('totalUsers');
      totalUsers.textContent = data.length;

      const labels = data.map(u => u.username);
      const imagesData = data.map(u => u.images);
      const segData = data.map(u => u.segmentations);

      data.forEach(u => {
        const tr = document.createElement('tr');
        tr.classList.add('border-b', 'hover:bg-gray-50');
        tr.innerHTML = `
          <td class="py-2 px-3">
            <a href="/admin/users/${u.id}/stats" class="text-blue-600 hover:underline">${u.username}</a>
          </td>
          <td class="py-2 px-3 text-center">${u.role}</td>
          <td class="py-2 px-3 text-center">${u.images}</td>
          <td class="py-2 px-3 text-center">${u.segmentations}</td>
        `;
        table.appendChild(tr);
      });

      // Chart.js — столбчатая диаграмма
      new Chart(document.getElementById('activityChart'), {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'Изображения',
              data: imagesData,
              backgroundColor: 'rgba(99,102,241,0.7)',
              borderRadius: 6,
            },
            {
              label: 'Сегменты',
              data: segData,
              backgroundColor: 'rgba(147,51,234,0.7)',
              borderRadius: 6,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#4b5563', font: { size: 13 } }
            }
          },
          scales: {
            x: {
              ticks: { color: '#4b5563', font: { size: 12 } },
              grid: { color: 'rgba(0,0,0,0.05)' }
            },
            y: {
              ticks: { color: '#4b5563', font: { size: 12 } },
              grid: { color: 'rgba(0,0,0,0.05)' },
              beginAtZero: true
            }
          }
        }
      });
    }

    loadUsers();

    function toggleMenu() {
      const m = document.getElementById('accountMenu');
      if (m) m.classList.toggle('hidden');
    }
  </script>
</body>
</html>
