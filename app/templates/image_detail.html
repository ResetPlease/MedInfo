<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ image.name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto max-w-screen-lg p-6">
    <header class="mb-8">
  <div
    class="flex flex-col sm:flex-row items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-6 py-5 text-white">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight flex items-center gap-2">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
      </svg>
      <a href="/">Wrinkles<span class="hidden sm:inline-block"> DB</span></a>
    </h1>

    <nav class="mt-4 sm:mt-0 flex space-x-4 text-lg font-medium">
      <a href="/" class="hover:underline hover:text-yellow-200 transition">Главная</a>
      <a href="/upload" class="hover:underline hover:text-yellow-200 transition">Загрузить</a>
      <a href="/backup" class="hover:underline hover:text-yellow-200 transition">Бэкап</a>
    </nav>
  </div>
</header>

    <div class="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto">
      <img src="{{ image.file_path }}" alt="{{ image.name }}" class="w-full h-auto rounded-md mb-4" />
      <h2 class="text-xl font-semibold text-gray-800 mb-2">Name: {{ image.name }}</h2>
      <p class="text-gray-500 mb-2">ID: {{ image.id }}</p>

      <div class="flex flex-wrap gap-2">
        {% for tag in image.tags.split(',') %}
        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded-full">{{ tag }}</span>
        {% endfor %}
      </div>
    </div>

    <div class="flex justify-center mt-6 space-x-4">
      <form action="/image/{{ image.id }}/delete" method="post"
        onsubmit="return confirm('Вы уверены, что хотите удалить это изображение?');">
        <button
          class="bg-red-500 text-white p-2 rounded-md hover:bg-red-600 shadow hover:shadow-md transition-transform active:scale-95">
          Удалить
        </button>
      </form>
    </div>

    <div class="border-b border-gray-300 my-8"></div>

    <div class="bg-white rounded-lg shadow-md p-6 max-w-2xl mx-auto">
      <h2 class="text-xl font-semibold text-gray-800 mb-4">Редактировать информацию</h2>
      <form action="/image/{{ image.id }}/update" method="post" class="space-y-4">
        <div>
          <label for="name" class="block text-gray-700">Название:</label>
          <input type="text" id="name" name="name" value="{{ image.name }}"
            class="w-full p-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <div>
          <label class="block text-gray-700 mb-1">Теги:</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {% for tag in tags %}
            <label class="inline-flex items-center space-x-2">
              <input type="checkbox" name="tags" value="{{ tag }}"
                {% if tag in image.tags.split(',') %}checked{% endif %} class="text-blue-500" />
              <span>{{ tag }}</span>
            </label>
            {% endfor %}
          </div>
        </div>

        <button type="submit"
          class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 shadow hover:shadow-md transition-transform active:scale-95">
          Сохранить изменения
        </button>
      </form>
    </div>
  </div>
</body>

</html>
