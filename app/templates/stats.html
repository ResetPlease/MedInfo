<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Статистика — Wrinkles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>


<style>
    @keyframes fade {
      from {opacity: 0; transform: translateY(-5px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .animate-fade { animation: fade 0.2s ease-out; }
  
    @keyframes slide {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }
    .animate-slide { animation: slide 0.3s ease-out; }
  </style>

<body class="bg-gray-100 font-sans">
    <div class="container mx-auto max-w-screen-lg p-6">
        <!-- HEADER -->
    <header class="mb-8">
        <div
          class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-4 sm:px-6 py-4 text-white">
          <!-- ЛОГО -->
          <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
            <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
            </svg>
            <a href="/" class="hover:text-yellow-300 transition">Wrinkles<span
                class="hidden sm:inline-block"> DB</span></a>
          </h1>
  
          <!-- КНОПКА ГАМБУРГЕР -->
          <button class="sm:hidden p-2 rounded-lg hover:bg-white/20 transition" onclick="toggleMobileNav()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
  
          <!-- ДЕСКТОП МЕНЮ -->
          <nav id="desktopNav" class="hidden sm:flex items-center gap-6 text-lg font-medium">
            <a href="/" class="hover:underline hover:text-yellow-200 transition">Главная</a>
            <a href="/upload" class="hover:underline hover:text-yellow-200 transition">Загрузить</a>
            <a href="/predict" class="hover:underline hover:text-yellow-200 transition">Magic</a>
            <a href="/stats" class="hover:underline hover:text-yellow-200 transition">Info</a>
  
            <!-- АККАУНТ -->
            <div class="relative">
              <button onclick="toggleMenu()"
                class="text-sm bg-white/10 hover:bg-white/20 rounded px-2 py-1">Аккаунт</button>
              <div id="accountMenu"
                class="hidden absolute right-0 mt-2 w-44 bg-white text-gray-800 rounded-xl shadow-lg py-2 animate-fade">
                <div
                  class="px-3 py-2 text-sm text-gray-600 truncate border-b">{{ request.state.current_user.username }}
                </div>
                <form action="/logout" method="post">
                  <button
                    class="w-full text-left px-3 py-2 hover:bg-gray-100 text-sm rounded-b-xl">Выйти</button>
                </form>
              </div>
            </div>
          </nav>
        </div>
  
        <!-- МОБИЛЬНОЕ МЕНЮ -->
        <div id="mobileMenu"
          class="sm:hidden hidden bg-gradient-to-r from-blue-600 to-purple-600 rounded-b-xl px-4 py-3 text-white animate-slide">
          <div class="flex flex-col gap-3">
            <a href="/" class="hover:underline">Главная</a>
            <a href="/upload" class="hover:underline">Загрузить</a>
            <a href="/predict" class="hover:underline">Magic</a>
            <a href="/stats" class="hover:underline">Info</a>
            <form action="/logout" method="post" class="mt-1">
              <button class="text-sm bg-white/20 hover:bg-white/30 rounded px-2 py-1 w-max">
                Выйти ({{ request.state.current_user.username }})
              </button>
            </form>
          </div>
        </div>
      </header>

        <div class="bg-white p-2 rounded-xl shadow-lg">
            <h2>Всего изображений: {{total_images}}</h2>
        </div>
        <hr>
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-semibold mb-4">Распределение тегов</h2>
            <canvas id="tagsChart" height="120"></canvas>
        </div>
        <hr>
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-semibold mb-4">Распределение тегов (в %)</h2>
            <canvas id="tagsPieChart" height="120"></canvas>
        </div>
        <hr>
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-2xl font-semibold mb-4">Топ сочетаний тегов</h2>
            <canvas id="tagCombosChart" height="120"></canvas>
        </div>
    </div>


    <script>
        async function loadTagStats() {
            const resp = await fetch('/api/stats/tags');
            const data = await resp.json();
            new Chart(document.getElementById('tagsChart'), {
                type: 'bar',
                data: {
                    labels: data.tags,
                    datasets: [{
                        label: 'Количество',
                        data: data.counts,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } } }
            });
        }

        async function loadTagPercentPie() {
            const resp = await fetch('/api/stats/tags-percent');
            const data = await resp.json();
            new Chart(document.getElementById('tagsPieChart'), {
                type: 'pie',
                data: {
                    labels: data.tags,
                    datasets: [{
                        data: data.percentages,
                        backgroundColor: data.tags.map((_, i) => `hsl(${i * 35 % 360}, 70%, 60%)`)
                    }]
                },
                options: { responsive: true }
            });
        }

        async function loadTagCombos() {
            const resp = await fetch('/api/stats/tag-combos');
            const data = await resp.json();
            new Chart(document.getElementById('tagCombosChart'), {
                type: 'bar',
                data: {
                    labels: data.combos,
                    datasets: [{
                        label: 'Частота',
                        data: data.counts,
                        backgroundColor: 'rgba(255, 159, 64, 0.6)',
                        borderColor: 'rgba(255, 159, 64, 1)',
                        borderWidth: 1
                    }]
                },
                options: { responsive: true, indexAxis: 'y' }
            });
        }

        loadTagStats();
        loadTagPercentPie();
        loadTagCombos();
    </script>
<script>
    function toggleMobileNav() {
      const m = document.getElementById('mobileMenu');
      if (m) m.classList.toggle('hidden');
    }
    function toggleMenu() {
      const m = document.getElementById('accountMenu');
      if (m) m.classList.toggle('hidden');
    }
    window.addEventListener('click', (e) => {
      const mobileMenu = document.getElementById('mobileMenu');
      if (mobileMenu && !e.target.closest('#mobileMenu') && !e.target.closest('button')) {
        // не всегда закрываем, т.к. может быть другой клик по кнопкам
      }
      const menu = document.getElementById('accountMenu');
      const trigger = e.target.closest('button');
      if (!menu) return;
      if (!e.target.closest('#accountMenu') && (!trigger || trigger.textContent.trim() !== 'Аккаунт')) {
        menu.classList.add('hidden');
      }
    });
  </script>
