<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль пользователя — Wrinkles</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  .card-gradient {
    background: linear-gradient(135deg, rgba(99,102,241,0.05), rgba(147,51,234,0.08));
  }

  .fade-in {
    opacity: 0;
    transform: translateY(10px);
    animation: fadeIn 0.6s ease forwards;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .image-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }

  .image-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }

  /* 📱 Адаптив под телефоны */
  @media (max-width: 640px) {
    .user-info {
      flex-direction: column;
      align-items: flex-start;
    }

    .user-stats {
      width: 100%;
      justify-content: space-around;
      border-top: 1px solid rgba(0,0,0,0.05);
      padding-top: 10px;
      margin-top: 10px;
    }

    #activityChart {
      max-width: 100%;
    }

    canvas {
      min-width: 600px; /* чтобы на телефоне график прокручивался, а не сжимался */
    }

    .image-card p {
      font-size: 0.85rem;
    }
    *, *::before, *::after {
  box-sizing: border-box;
}
  }
</style>
</head>

<body class="bg-gray-100 font-sans min-h-screen">
  <div class="container mx-auto max-w-screen-lg p-6">

    <!-- HEADER -->
    <header class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl shadow-lg px-4 sm:px-6 py-4 mb-10">
      <a href="/admin/stats" class="flex items-center gap-2 hover:text-yellow-200 transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Назад
      </a>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Информация о пользователе</h1>
      <div class="text-sm text-white/80">{{ request.state.current_user.username }}</div>
    </header>

    <!-- MAIN -->
    <main class="space-y-10 fade-in">

      <!-- Профиль -->
      <section class="bg-white/90 rounded-2xl shadow-lg p-6 card-gradient">
  <div class="flex user-info sm:justify-between sm:items-center gap-6">
    <div>
      <h2 id="username" class="text-2xl font-bold text-gray-800">–</h2>
      <p class="text-gray-500 mt-1">Роль: <span id="role" class="font-semibold text-blue-700">–</span></p>
    </div>
    <div class="flex gap-6 text-center user-stats">
      <div>
        <p id="imageCount" class="text-lg font-semibold text-blue-600">–</p>
        <p class="text-gray-500 text-sm">Изображений</p>
      </div>
      <div>
        <p id="segCount" class="text-lg font-semibold text-purple-600">–</p>
        <p class="text-gray-500 text-sm">Сегментов</p>
      </div>
    </div>
  </div>
</section>

      <!-- Активность -->
      <section class="bg-white/90 rounded-2xl shadow-lg p-6 card-gradient">
        <h3 class="text-xl font-semibold text-gray-800 mb-4 text-center">Активность по дням загрузок</h3>
        <div class="overflow-x-auto">
          <div class="min-w-[900px] h-[420px]">
            <canvas id="activityChart"></canvas>
          </div>
        </div>
      </section>

      <!-- Изображения -->
<section class="bg-white/90 rounded-2xl shadow-lg p-6 card-gradient">
  <h3 class="text-xl font-semibold text-gray-800 mb-4 text-center">Изображения пользователя</h3>

  <!-- внутренний контейнер, чтобы карточки не липли к стенкам -->
  <div class="px-1 sm:px-2 md:px-0">
    <div id="imagesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 place-items-stretch"></div>
  </div>

  <p id="loadingIndicator" class="text-center text-gray-500 mt-4 hidden">Загрузка...</p>
</section>

    </main>
  </div>

  <script>
    const userId = window.location.pathname.split("/").filter(Boolean).at(-2);
    let images = [];
    let currentPage = 0;
    const perPage = 12;
    let allLoaded = false;

    async function loadUserData() {
      const resp = await fetch(`/api/admin/users/${userId}`);
      const data = await resp.json();

      // Профиль
      document.getElementById("username").textContent = data.username;
      document.getElementById("role").textContent = data.role;
      document.getElementById("imageCount").textContent = data.images.length;
      const totalSegs = data.images.reduce((sum, img) => sum + img.segmentations, 0);
      document.getElementById("segCount").textContent = totalSegs;

      images = data.images;

      // Умное усреднение (если > 60 дней)
      if (data.activity_dates.length > 60) {
        const aggregated = {};
        for (let i = 0; i < data.activity_dates.length; i++) {
          const d = new Date(data.activity_dates[i]);
          const month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          aggregated[month] = (aggregated[month] || 0) + data.activity_counts[i];
        }
        data.activity_dates = Object.keys(aggregated);
        data.activity_counts = Object.values(aggregated);
      }

      // График
      new Chart(document.getElementById("activityChart"), {
        type: 'bar',
        data: {
          labels: data.activity_dates,
          datasets: [{
            label: 'Загруженные изображения',
            data: data.activity_counts,
            backgroundColor: 'rgba(99,102,241,0.7)',
            borderRadius: 6,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              ticks: { color: '#4b5563', font: { size: 12 } },
              grid: { color: 'rgba(0,0,0,0.05)' }
            },
            y: {
              ticks: { color: '#4b5563', font: { size: 12 } },
              grid: { color: 'rgba(0,0,0,0.05)' },
              beginAtZero: true
            }
          }
        }
      });

      renderNextImages();
    }

    function renderNextImages() {
      const grid = document.getElementById("imagesGrid");
      const loader = document.getElementById("loadingIndicator");
      if (allLoaded) return;

      loader.classList.remove("hidden");

      setTimeout(() => {
        const start = currentPage * perPage;
        const end = start + perPage;
        const chunk = images.slice(start, end);
        if (!chunk.length) {
          allLoaded = true;
          loader.classList.add("hidden");
          return;
        }

        for (const img of chunk) {
          const div = document.createElement("div");
          div.className = "image-card bg-white border rounded-xl p-3 sm:p-4 shadow-sm";
          div.onclick = () => window.location.href = `/image/${img.id}`;
          div.innerHTML = `
            <div class="flex justify-between items-center mb-2">
              <p class="font-medium text-gray-800 truncate">${img.name}</p>
              <span class="text-xs px-2 py-1 rounded-full ${img.is_verified ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-700'}">
                ${img.is_verified ? 'Проверено' : 'Не проверено'}
              </span>
            </div>
            <p class="text-sm text-gray-500">Сегментов: <b>${img.segmentations}</b></p>
            <p class="text-sm text-gray-400 mt-1">Загружено: ${img.uploaded_at ? new Date(img.uploaded_at).toLocaleString() : '-'}</p>
          `;
          grid.appendChild(div);
        }

        currentPage++;
        loader.classList.add("hidden");
      }, 300);
    }

    window.addEventListener("scroll", () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
        renderNextImages();
      }
    });

    loadUserData();
  </script>
</body>
</html>
