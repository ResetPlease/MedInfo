<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wrinkles Classification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon" />
  <style>
    #accountMenu {
      z-index: 1000;
    }
    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade {
      animation: fade 0.2s ease-out;
    }

    @keyframes slide {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-slide {
      animation: slide 0.3s ease-out;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-top: 5px solid #4f46e5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 10px #4f46e5, 0 0 20px #4f46e5, 0 0 30px #4f46e5;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .tag {
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 500;
      color: white;
      box-shadow: 0 0 5px #4f46e5, 0 0 10px #9333ea;
      opacity: 0;
      transform: translateY(-10px);
      animation: fadeInTag 0.5s forwards;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: default;
    }

    @keyframes fadeInTag {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .tag:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px #fff, 0 0 20px #4f46e5, 0 0 30px #9333ea;
    }

    #result {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.5s, transform 0.5s;
    }

    #result.show {
      opacity: 1;
      transform: translateY(0);
    }

    #previewContainer {
      display: flex;
      justify-content: center;
      margin-bottom: 1rem;
    }

    #previewImage {
      max-width: 100%;
      max-height: 300px;
      border: 4px solid #4f46e5;
      border-radius: 16px;
      box-shadow: 0 0 20px #4f46e5, 0 0 40px #9333ea;
      animation: swing 2s ease-in-out infinite alternate;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    #previewImage:hover {
      transform: scale(1.05) rotate(2deg);
      box-shadow: 0 0 30px #fff, 0 0 40px #4f46e5, 0 0 50px #9333ea;
    }

    @keyframes swing {
      0% {
        transform: rotate(-2deg);
      }

      100% {
        transform: rotate(2deg);
      }
    }
  </style>
</head>

<body class="bg-gray-100 font-sans">
  <div class="container mx-auto max-w-screen-md p-6">
    <header class="mb-8">
      <div
        class="flex items-center justify-between bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl shadow-lg px-4 sm:px-6 py-4 text-white">
        <!-- ЛОГО -->
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight flex items-center gap-2">
          <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 7l6 6-6 6M9 7h6a4 4 0 014 4v6" />
          </svg>
          <a href="/" class="hover:text-yellow-300 transition">Wrinkles<span
              class="hidden sm:inline-block"> DB</span></a>
        </h1>

        <!-- КНОПКА ГАМБУРГЕР -->
        <button class="sm:hidden p-2 rounded-lg hover:bg-white/20 transition" onclick="toggleMobileNav()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- ДЕСКТОП МЕНЮ -->
        <nav id="desktopNav" class="hidden sm:flex items-center gap-6 text-lg font-medium">
          <a href="/" class="hover:underline hover:text-yellow-200 transition">Главная</a>
          {% if at_least_worker(request.state.current_user) %}
          <a href="/upload" class="hover:underline hover:text-yellow-200 transition">Загрузить</a>
          {% endif %}
          <a href="/predict" class="hover:underline hover:text-yellow-200 transition">Magic</a>
          <a href="/stats" class="hover:underline hover:text-yellow-200 transition">Info</a>

          <!-- АККАУНТ -->
          <div class="relative">
            <button onclick="toggleMenu()"
              class="text-sm bg-white/10 hover:bg-white/20 rounded px-2 py-1">Аккаунт</button>
            <div id="accountMenu"
              class="hidden absolute right-0 mt-2 w-44 bg-white text-gray-800 rounded-xl shadow-lg py-2 animate-fade">
              <div
                class="px-3 py-2 text-sm text-gray-600 truncate border-b">{{ request.state.current_user.username }}
              </div>
              <form action="/logout" method="post">
                <button
                  class="w-full text-left px-3 py-2 hover:bg-gray-100 text-sm rounded-b-xl">Выйти</button>
              </form>
            </div>
          </div>
        </nav>
      </div>

      <!-- МОБИЛЬНОЕ МЕНЮ -->
      <div id="mobileMenu"
        class="sm:hidden hidden bg-gradient-to-r from-blue-600 to-purple-600 rounded-b-xl px-4 py-3 text-white animate-slide">
        <div class="flex flex-col gap-3">
          <a href="/" class="hover:underline">Главная</a>
          {% if at_least_worker(request.state.current_user) %}
          <a href="/upload" class="hover:underline">Загрузить</a>
          {% endif %}
          <a href="/predict" class="hover:underline">Magic</a>
          <a href="/stats" class="hover:underline">Info</a>
          <form action="/logout" method="post" class="mt-1">
            <button class="text-sm bg-white/20 hover:bg-white/30 rounded px-2 py-1 w-max">
              Выйти ({{ request.state.current_user.username }})
            </button>
          </form>
        </div>
      </div>
    </header>

    <div
      class="bg-gradient-to-tr from-blue-50 to-purple-50 p-6 rounded-xl shadow-lg max-w-lg mx-auto space-y-4 relative overflow-hidden">
      <h2 class="text-2xl font-bold text-gray-800 mb-4 relative z-10">Мульти-лейбл magic</h2>

      <label id="selectLabel" for="imageInput" class="relative z-10 inline-block w-full cursor-pointer">
        <div
          class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-purple-600 hover:to-blue-500 text-white font-semibold py-2 px-4 rounded-lg text-center shadow-md hover:shadow-xl transition-all duration-300">
          Выбрать изображение
        </div>
        <input type="file" id="imageInput" accept=".jpg,.jpeg,.png" class="hidden">
      </label>

      <button id="magicBtn" onclick="predictImage()"
        class="relative z-10 w-full py-2 rounded-lg bg-gradient-to-r from-purple-500 to-blue-500 text-white font-bold shadow-md hover:shadow-2xl hover:scale-105 transition-all duration-300 transform hover:animate-glow hidden">
        🔮 magic
      </button>

      <div id="previewContainer" class="flex justify-center mt-4">
        <img id="previewImage" src="" alt="Preview"
          class="hidden max-h-64 rounded-xl border-4 border-blue-500 shadow-lg animate-swing">
      </div>

      <div id="loader" class="hidden flex justify-center items-center my-4 relative z-10">
        <div class="spinner"></div>
      </div>

      <div id="result" class="p-4 rounded-lg text-gray-900 font-medium hidden relative z-10 bg-white bg-opacity-60">
        <h3 class="text-lg font-semibold mb-2">Предсказанные морщины:</h3>
        <div id="tagsContainer" class="flex flex-wrap gap-2 justify-center"></div>
        <button id="retryBtn" onclick="resetForm()"
          class="mt-4 text-sm text-blue-600 hover:text-purple-600 transition-opacity opacity-70 hover:opacity-100">Попробовать
          снова</button>
      </div>
    </div>

    <script>
      const input = document.getElementById("imageInput");
      const preview = document.getElementById("previewImage");
      const selectLabel = document.getElementById("selectLabel");
      const magicBtn = document.getElementById("magicBtn");
      const resultDiv = document.getElementById("result");
      const tagsContainer = document.getElementById("tagsContainer");
      const loader = document.getElementById("loader");
      const retryBtn = document.getElementById("retryBtn");

      input.addEventListener("change", function () {
        const file = input.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            preview.src = e.target.result;
            preview.classList.remove("hidden");
          };
          reader.readAsDataURL(file);
          selectLabel.classList.add("hidden");
          magicBtn.classList.remove("hidden");
        } else {
          resetForm();
        }
      });

      async function predictImage() {
        if (!input.files || input.files.length === 0) return;
        const file = input.files[0];
        const formData = new FormData();
        formData.append("file", file);

        loader.classList.remove("hidden");
        resultDiv.classList.remove("show");
        tagsContainer.innerHTML = "";
        magicBtn.disabled = true;

        try {
          const response = await fetch("/predict", {
            method: "POST",
            body: formData
          });
          loader.classList.add("hidden");
          magicBtn.disabled = false;

          if (!response.ok) throw new Error(`Ошибка: ${response.statusText}`);

          const data = await response.json();
          if (data.wrinkles && data.wrinkles.length > 0) {
            data.wrinkles.forEach((tag, index) => {
              const span = document.createElement("span");
              span.className = "tag";
              span.style.animationDelay = `${index * 0.1}s`;
              span.textContent = tag;
              tagsContainer.appendChild(span);
            });
          } else {
            const span = document.createElement("span");
            span.className = "tag";
            span.style.background = "#777";
            span.style.animation = "none";
            span.textContent = "Морщины не обнаружены";
            tagsContainer.appendChild(span);
          }

          resultDiv.classList.remove("hidden");
          setTimeout(() => resultDiv.classList.add("show"), 50);
        } catch (err) {
          loader.classList.add("hidden");
          magicBtn.disabled = false;
          resultDiv.classList.remove("hidden");
          resultDiv.classList.add("show");
          tagsContainer.innerHTML = "<span class='tag' style='background:#f87171; animation:none;'>Ошибка при отправке изображения</span>";
          console.error(err);
        }
      }

      function resetForm() {
        input.value = "";
        preview.src = "";
        preview.classList.add("hidden");
        selectLabel.classList.remove("hidden");
        magicBtn.classList.add("hidden");
        resultDiv.classList.add("hidden");
        tagsContainer.innerHTML = "";
      }
    </script>

    <style>
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 0, 0, 0.1);
        border-top: 4px solid #4f46e5;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 10px #4f46e5, 0 0 20px #9333ea;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      .tag {
        background: linear-gradient(135deg, #4f46e5, #9333ea);
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 0.875rem;
        font-weight: 500;
        color: white;
        box-shadow: 0 0 5px #4f46e5, 0 0 10px #9333ea;
        opacity: 0;
        transform: translateY(-10px);
        animation: fadeInTag 0.5s forwards;
        cursor: default;
      }

      .tag:hover {
        transform: scale(1.1);
        box-shadow: 0 0 10px #fff, 0 0 20px #4f46e5, 0 0 30px #9333ea;
      }

      @keyframes fadeInTag {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .animate-swing {
        animation: swing 2s ease-in-out infinite alternate;
      }

      @keyframes swing {
        0% {
          transform: rotate(-2deg);
        }

        100% {
          transform: rotate(2deg);
        }
      }

      @keyframes glow {

        0%,
        100% {
          box-shadow: 0 0 15px #fff, 0 0 20px #4f46e5;
        }

        50% {
          box-shadow: 0 0 25px #fff, 0 0 35px #9333ea;
        }
      }

      .animate-glow {
        animation: glow 1.2s ease-in-out infinite alternate;
      }
    </style>
<script>
  function toggleMobileNav() {
    const m = document.getElementById('mobileMenu');
    if (m) m.classList.toggle('hidden');
  }
  function toggleMenu() {
    const m = document.getElementById('accountMenu');
    if (m) m.classList.toggle('hidden');
  }
  window.addEventListener('click', (e) => {
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenu && !e.target.closest('#mobileMenu') && !e.target.closest('button')) {
      // не всегда закрываем, т.к. может быть другой клик по кнопкам
    }
    const menu = document.getElementById('accountMenu');
    const trigger = e.target.closest('button');
    if (!menu) return;
    if (!e.target.closest('#accountMenu') && (!trigger || trigger.textContent.trim() !== 'Аккаунт')) {
      menu.classList.add('hidden');
    }
  });
</script>
</body>

</html>
